apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-frame-frontend
  namespace: family-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app: family-frame-frontend
  template:
    metadata:
      labels:
        app: family-frame-frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ghcr.io/replace-me/family-frame-frontend:RELEASE_SHA
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: family-frame-config
                  key: API_ORIGIN
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: family-frame-frontend
  namespace: family-frame
spec:
  selector:
    app: family-frame-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-frame-backend
  namespace: family-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app: family-frame-backend
  template:
    metadata:
      labels:
        app: family-frame-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/replace-me/family-frame-backend:RELEASE_SHA
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: family-frame-config
            - secretRef:
                name: family-frame-secrets
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: family-frame-backend
  namespace: family-frame
spec:
  selector:
    app: family-frame-backend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: family-frame-auth-rate-limit
  namespace: family-frame
  annotations:
    nginx.ingress.kubernetes.io/limit-rpm: "5"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - family-frame.example.com
      secretName: family-frame-tls
  rules:
    - host: family-frame.example.com
      http:
        paths:
          - path: /api/auth/login
            pathType: Exact
            backend:
              service:
                name: family-frame-backend
                port:
                  name: http
          - path: /api/auth/signup
            pathType: Exact
            backend:
              service:
                name: family-frame-backend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: family-frame
  namespace: family-frame
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - family-frame.example.com
      secretName: family-frame-tls
  rules:
    - host: family-frame.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: family-frame-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: family-frame-frontend
                port:
                  name: http
