services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_frame
      POSTGRES_USER: family_frame
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_frame"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minio minio_password; do sleep 1; done;
        mc mb --ignore-existing local/family-frame;
        printf '%s\n' '{"Rules":[{"ID":"expire-temp-uploads-after-one-day","Status":"Enabled","Filter":{"Prefix":"temp/"},"Expiration":{"Days":1}}]}'
        | mc ilm rule import local/family-frame

volumes:
  postgres-data:
  minio-data:
