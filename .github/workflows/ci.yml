name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: postgresql://family_frame:local_password@localhost:5432/family_frame
      NEXT_TELEMETRY_DISABLED: "1"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: family-frame
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio_password
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate orchestration files
        run: |
          node --check scripts/dev.mjs
          docker compose config --quiet
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start integration services
        run: |
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init
      - name: Validate single-family migration preflight
        run: docker compose exec -T postgres psql -U family_frame -d family_frame -v ON_ERROR_STOP=1 < deploy/k8s/preflight-single-family.sql
      - run: pnpm db:migrate:deploy
      - name: Run PostgreSQL and MinIO integration smoke
        env:
          RUN_INTEGRATION: "1"
        run: pnpm --filter ./backend exec vitest run test/app.integration.spec.ts
      - run: pnpm build
      - name: Stop integration services
        if: always()
        run: docker compose down -v
